version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "@shotstack/schemas"
      - dependency-name: "@shotstack/shotstack-canvas"
      - dependency-name: "mediabunny"
      - dependency-name: "zod"
    commit-message:
      prefix: "chore"
      include: "scope"
