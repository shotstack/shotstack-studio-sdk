name: Release
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Verify & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    env:
      HAS_EXTENDED_TESTS: ${{ secrets.EXTENDED_REGRESSION_SSH_KEY != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: shotstack-studio-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: shotstack-studio-sdk
        run: npm install

      - name: Run verification suite
        working-directory: shotstack-studio-sdk
        run: npm run verify:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: shotstack-studio-sdk/coverage/
          retention-days: 14

      - name: "[Extended] Set up SSH for regression suite"
        if: env.HAS_EXTENDED_TESTS == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EXTENDED_REGRESSION_SSH_KEY }}

      - name: "[Extended] Clone regression suite"
        if: env.HAS_EXTENDED_TESTS == 'true'
        run: git clone git@github.com:shotstack/shotstack-studio-extended-regression-suite.git

      - name: "[Extended] Install test dependencies"
        if: env.HAS_EXTENDED_TESTS == 'true'
        working-directory: shotstack-studio-extended-regression-suite
        run: npm install

      - name: "[Extended] Run behavioural regression tests"
        if: env.HAS_EXTENDED_TESTS == 'true'
        working-directory: shotstack-studio-extended-regression-suite
        run: npm test

      # A stack releases once, when its last PR merges: semantic-release then reads every commit since the
      # last release. Earlier PRs in the stack, titled [n/m] with n < m, hold the release.
      - name: Hold the release for an unfinished stack
        id: stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].title // ""')
          if [[ "$title" =~ ^\[([0-9]+)/([0-9]+)\] ]] && (( BASH_REMATCH[1] < BASH_REMATCH[2] )); then
            echo "hold=true" >> "$GITHUB_OUTPUT"
            echo "Holding the release until the stack's last PR merges: $title"
          fi

      - name: Release
        if: steps.stack.outputs.hold != 'true'
        working-directory: shotstack-studio-sdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
